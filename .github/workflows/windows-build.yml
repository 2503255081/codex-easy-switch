name: Windows portable EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install . -r packaging/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python packaging/build_windows.py
      - run: python packaging/verify_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Provider-Launcher-Windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.sha256
