name: Publish portable release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: Windows-x64
          - os: windows-latest
            arch: x86
            target: Windows-x86
          - os: ubuntu-22.04
            arch: x64
            target: Linux-x64
          - os: ubuntu-22.04-arm
            arch: arm64
            target: Linux-arm64
          - os: macos-15-intel
            arch: x64
            target: macOS-x64
          - os: macos-15
            arch: arm64
            target: macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev libsecret-1-0 xvfb
      - run: python -m pip install --only-binary=cryptography,cffi ".[test]" -r packaging/requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Build and verify Windows binary
        if: runner.os == 'Windows'
        run: |
          python packaging/build_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/verify_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build POSIX binary
        if: runner.os != 'Windows'
        run: python packaging/build_posix.py
      - name: Verify Linux GUI
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/verify_posix_gui.py
      - name: Verify macOS GUI
        if: runner.os == 'macOS'
        run: python packaging/verify_posix_gui.py
      - run: python packaging/verify_https.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      - name: Publish verified portable downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "Codex Easy Switch $GITHUB_REF_NAME" --notes-file packaging/release-notes.md
