name: Linux and macOS portable builds
on:
  workflow_dispatch:
  push:
    branches: [portable-posix-build]
jobs:
  official-linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Inspect official desktop bundle and validate its Codex CLI
        shell: bash
        run: |
          curl -fL --retry 2 --max-time 300 -o "$RUNNER_TEMP/chatgpt.deb" https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb
          dpkg-deb --fsys-tarfile "$RUNNER_TEMP/chatgpt.deb" | tar -x -C "$RUNNER_TEMP" ./usr/lib/chatgpt/resources/codex ./usr/share/applications/chatgpt.desktop
          grep '^Exec=' "$RUNNER_TEMP/usr/share/applications/chatgpt.desktop"
          "$RUNNER_TEMP/usr/lib/chatgpt/resources/codex" --version
          python -c 'import os; from pathlib import Path; from codex_provider_launcher.probe import validate; p=Path(os.environ["RUNNER_TEMP"])/"usr/lib/chatgpt/resources/codex"; r=validate(p,b"",timeout=45); print("official bundled CLI model count:",len(r[3]["data"]))'
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: Linux-x64
          - os: ubuntu-22.04-arm
            target: Linux-arm64
          - os: macos-15-intel
            target: macOS-x64
          - os: macos-15
            target: macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev libsecret-1-0 xvfb
      - run: python -m pip install . -r packaging/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and run binary self-test
        run: python packaging/build_posix.py
      - name: Test Linux graphical interface
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/verify_posix_gui.py
      - name: Test macOS graphical interface
        if: runner.os == 'macOS'
        run: python packaging/verify_posix_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Provider-Launcher-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
