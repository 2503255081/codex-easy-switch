name: Linux and macOS portable builds
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: Linux-x64
          - os: ubuntu-22.04-arm
            target: Linux-arm64
          - os: macos-15-intel
            target: macOS-x64
          - os: macos-15
            target: macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev libsecret-1-0 xvfb
      - run: python -m pip install . -r packaging/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and run binary self-test
        run: python packaging/build_posix.py
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Provider-Launcher-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
